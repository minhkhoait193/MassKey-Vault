name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Check committed dependency lockfiles
        shell: pwsh
        run: |
          if (!(Test-Path 'package-lock.json')) { throw 'Commit package-lock.json first. Run prepare_github_windows.bat on Windows.' }
          if (!(Test-Path 'src-tauri/Cargo.lock')) { throw 'Commit src-tauri/Cargo.lock first. Run prepare_github_windows.bat on Windows.' }

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and production web build
        run: npm run build

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload unsigned installer for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: MassKey-Vault-Windows-unsigned-preview
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
