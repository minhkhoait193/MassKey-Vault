name: Windows Beta Release (draft)

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: read

jobs:
  draft-beta:
    name: Build and attach unsigned beta installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release versions and lockfiles
        shell: pwsh
        run: |
          if (!(Test-Path 'package-lock.json')) { throw 'package-lock.json must be committed.' }
          if (!(Test-Path 'src-tauri/Cargo.lock')) { throw 'src-tauri/Cargo.lock must be committed.' }
          $npmVersion = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path 'src-tauri/Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (!$cargoMatch) { throw 'Could not find Cargo package version.' }
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value
          if ($npmVersion -ne $tauriVersion -or $npmVersion -ne $cargoVersion) { throw 'package.json, tauri.conf.json and Cargo.toml versions must match.' }
          $tag = '${{ github.ref_name }}'
          if (!$tag.StartsWith("v$npmVersion-beta.")) { throw "Tag $tag does not match app version $npmVersion-beta.N." }

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and production web build
        run: npm run build

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Compute SHA-256 and validate installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS exe, found $($files.Count)." }
          $installer = $files[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Create or update draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          $assets = @($files[0].FullName, 'SHA256SUMS.txt')
          $releases = @(gh release list --limit 200 --json tagName,isDraft | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if ($LASTEXITCODE -ne 0) { throw 'Could not query existing releases.' }
          if ($releases.Count -gt 0) {
            if (!$releases[0].isDraft) { throw 'Refusing to replace installer assets of an already published release.' }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --prerelease --verify-tag --title "MassKey Vault $tag (unsigned beta)" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or upload GitHub release assets.' }
