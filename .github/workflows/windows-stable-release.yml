name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-beta.') }}
    name: Test and publish unsigned Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify versions and lockfiles
        shell: pwsh
        run: |
          if (!(Test-Path 'package-lock.json')) { throw 'package-lock.json must be committed.' }
          if (!(Test-Path 'src-tauri/Cargo.lock')) { throw 'src-tauri/Cargo.lock must be committed.' }
          $npmVersion = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $lockVersion = node -p "require('./package-lock.json').version"
          $tauriVersion = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path 'src-tauri/Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (!$cargoMatch) { throw 'Could not find Cargo package version.' }
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value
          if ($npmVersion -ne $lockVersion -or $npmVersion -ne $tauriVersion -or $npmVersion -ne $cargoVersion) { throw 'App and lockfile versions must match.' }
          if ('${{ github.ref_name }}' -ne "v$npmVersion") { throw 'Tag does not match app version.' }
          $identifier = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).identifier
          if ($identifier -ne 'com.masskey.vault') { throw 'App identifier changed; upgrade data path may break.' }

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and production web build
        run: npm run build

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Compute SHA-256 and validate installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS exe, found $($files.Count)." }
          $installer = $files[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release with installer and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($files.Count -ne 1) { throw 'Installer asset missing.' }
          $assets = @($files[0].FullName, 'SHA256SUMS.txt')
          gh release create $tag @assets --verify-tag --title "MassKey Vault $tag (unsigned)" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub release.' }
